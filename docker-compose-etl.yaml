        import pandas as pd
        import numpy as np
        import os
        import joblib
        from sklearn.preprocessing import StandardScaler, LabelEncoder

        LABEL_COL = "risk_level"

        KEEP_COLS = [
            "loan_amnt", "funded_amnt", "funded_amnt_inv", "int_rate", "installment",
            "sub_grade", "home_ownership", "annual_inc", "verification_status", "dti",
            "delinq_2yrs", "fico_range_low", "fico_range_high", "inq_last_6mths",
            "open_acc", "pub_rec", "revol_bal", "revol_util", "total_acc",
            "collections_12_mths_ex_med", "acc_now_delinq", "tot_coll_amt",
            "tot_cur_bal", "open_act_il", "open_il_12m", "total_bal_il",
            "open_rv_12m", "max_bal_bc", "all_util", "total_rev_hi_lim", "inq_fi",
            "total_cu_tl", "inq_last_12m", "avg_cur_bal", "bc_open_to_buy", "bc_util",
            "chargeoff_within_12_mths", "delinq_amnt", "mort_acc",
            "mths_since_recent_inq", "num_actv_bc_tl", "num_actv_rev_tl",
            "num_bc_sats", "num_bc_tl", "num_il_tl", "num_op_rev_tl",
            "num_rev_accts", "num_rev_tl_bal_gt_0", "num_sats",
            "num_tl_120dpd_2m", "num_tl_30dpd", "num_tl_90g_dpd_24m",
            "num_tl_op_past_12m", "pct_tl_nvr_dlq", "percent_bc_gt_75",
            "pub_rec_bankruptcies", "tax_liens", "tot_hi_cred_lim",
            "total_bal_ex_mort", "total_bc_limit", "total_il_high_credit_limit",
            LABEL_COL
        ]

        CATEGORICAL_ONEHOT = ["home_ownership", "verification_status"]
        CATEGORICAL_LABEL = ["sub_grade"]

        # Read raw training data
        df = pd.read_csv("/mnt/data/LoanData/train.csv", low_memory=False)
        log_msgs = []

        # Check for column existence
        missing_cols = [col for col in KEEP_COLS if col not in df.columns]
        if missing_cols:
            raise ValueError(f"Missing expected columns: {missing_cols}")
        df = df[KEEP_COLS]

        # Separate label
        label_series = df.pop(LABEL_COL)

        # Store stats
        median_values = {}
        mode_values = {}
        label_encoders = {}
        onehot_columns = []

        # Handle NaNs
        for col in df.columns:
            if df[col].isnull().sum() > 0:
                if df[col].dtype == object:
                    mode = df[col].mode()
                    fill_val = mode[0] if not mode.empty else "Unknown"
                    df[col] = df[col].fillna(fill_val)
                    mode_values[col] = fill_val
                    log_msgs.append(f"Filled NaNs in {col} with mode: {fill_val}")
                else:
                    median_val = df[col].median()
                    df[col] = df[col].fillna(median_val)
                    median_values[col] = median_val
                    log_msgs.append(f"Filled NaNs in {col} with median: {median_val}")

        # One-hot encoding
        for col in CATEGORICAL_ONEHOT:
            dummies = pd.get_dummies(df[col], prefix=col)
            onehot_columns.extend(dummies.columns.tolist())
            df = pd.concat([df.drop(columns=[col]), dummies], axis=1)
            log_msgs.append(f"One-hot encoded: {col} -> {dummies.columns.tolist()}")

        # Label encoding
        for col in CATEGORICAL_LABEL:
            le = LabelEncoder()
            df[col] = le.fit_transform(df[col].astype(str))
            label_encoders[col] = le
            log_msgs.append(f"Label-encoded: {col}")
        # Standard scaling
        numeric_cols = df.select_dtypes(include=[np.number]).columns.tolist()
        scaler = StandardScaler()
        df[numeric_cols] = scaler.fit_transform(df[numeric_cols])
        log_msgs.append(f"Standard-scaled columns: {numeric_cols}")

        # Reattach label
        df[LABEL_COL] = label_series.reset_index(drop=True)
        log_msgs.append("Re-attached label column.")

        # Save transformed data
        df.to_csv("train_transformed_1.csv", index=False)

        # Save transformation artifacts
        artifacts = {
            "median_values": median_values,
            "mode_values": mode_values,
            "label_encoders": label_encoders,
            "onehot_columns": onehot_columns,
            "scaler": scaler,
            "numeric_cols": numeric_cols,
            "categorical_onehot": CATEGORICAL_ONEHOT,
            "categorical_label": CATEGORICAL_LABEL,
            "keep_cols": KEEP_COLS
        }
        joblib.dump(artifacts, "transform_artifacts.pkl")

        # Save logs
        with open("etl_log_1.txt", "w") as f:
            for line in log_msgs:
                f.write(line + "\n")

        print("✅ Transformation complete. Artifacts saved.")

                '

