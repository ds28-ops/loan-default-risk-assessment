services:
  extract-data:
    container_name: etl_extract_data
    image: python:3.11
    user: root
    volumes:
      - /mnt/data:/mnt/data
    working_dir: /mnt/data
    command:
      - bash
      - -c
      - |
        set -e
        pip install gdown
        echo "Resetting dataset directory..."
        rm -rf LoanData
        mkdir -p LoanData
        cd LoanData

        echo "Downloading training CSV..."
        gdown --fuzzy 'https://drive.google.com/file/d/12AYwEwxSPYA8c3Vlsmve1H4hQDmJF0QA' -O train.csv

        echo "Listing contents of /data after extract stage:"
        ls -l /mnt/data/LoanData

