version: "3.8"
services:
  fastapi_server:
    build:
      context: .
      dockerfile: fastapi_pt/Dockerfile
    container_name: fastapi_server
    ports:
      - "8000:8000"

  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile
    container_name: flask_frontend
    ports:
      - "80:5000"
    environment:
      - FASTAPI_SERVER_URL=http://fastapi_server:8000
    depends_on:
      - fastapi_server
